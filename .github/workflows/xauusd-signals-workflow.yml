name: Send Telegram Trading Signal

on:
  # Attivazione manuale da interfaccia GitHub Actions
  workflow_dispatch:
    inputs:
      direction:
        description: 'Direzione Ordine (BUY/SELL)'
        required: true
        default: 'BUY'
        type: choice
        options:
          - BUY
          - SELL
      price:
        description: 'Prezzo d'Ingresso XAU/USD'
        required: true
        type: string

  # Attivazione remota tramite Webhook / API
  repository_dispatch:
    types: [tradingview_alert]

jobs:
  send-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione Script Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIGNAL_DIRECTION: ${{ github.event.inputs.direction || github.event.client_payload.direction }}
          SIGNAL_PRICE: ${{ github.event.inputs.price || github.event.client_payload.price }}
        run: |
          python xauusd_signal.py "$SIGNAL_DIRECTION" "$SIGNAL_PRICE"
