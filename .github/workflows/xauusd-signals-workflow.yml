name: XAUUSD Signal Automation

on:
  schedule:
    - cron: '*/15 * * * *' # Esegue lo script ogni 15 minuti (opzionale)
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xauusd_signal.py

      - name: Commit e Push dello Stato
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state/xauusd_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update state [skip ci]" && git push)

