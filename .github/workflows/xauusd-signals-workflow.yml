name: XAUUSD Hedge Risk Signals

on:
  schedule:
    # Ogni 30 minuti. Il minimo consentito da GitHub Actions è 5 minuti,
    # ma con 30 minuti si resta comodamente dentro le 2000 minuti gratuite
    # al mese di un repository privato. Vedi note nel README.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # permette di lanciarlo manualmente da GitHub per testare

permissions:
  contents: write  # necessario per ricommittare il file di stato

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run signal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOT_SIZE: "1.04"
          DAILY_STOP: "2700"
          DAILY_TARGET: "3000"
          BUCKET_SECONDS: "1800"
        run: python xauusd_signals_action.py

      - name: Commit updated state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiorna stato bot XAUUSD"
          file_pattern: "state/xauusd_state.json"
