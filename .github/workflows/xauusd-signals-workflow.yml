name: XAUUSD Anti-Trend Signal Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'  # Esegue ogni 15 minuti

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Signal Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python xauusd_signal.py

      - name: Commit updated JSON state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/xauusd_state.json
          git commit -m "Auto-update XAUUSD price state [skip ci]" || echo "Nessuna modifica da salvare"
          git push
