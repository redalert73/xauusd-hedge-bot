name: VWAP Contrarian Backtest

on:
  workflow_dispatch: # Ti permette di avviarlo manualmente con un click da GitHub
  # schedule:
  #   - cron: '0 8 * * *' # Opzionale: esecuzione automatica giornaliera

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run VWAP Contrarian Backtest
      env:
        TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      run: |
        python vwap_contrarian_backtest.py
