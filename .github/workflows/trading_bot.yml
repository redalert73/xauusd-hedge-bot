name: XAUUSD Modular Bot

on:
  # Esecuzione automatica programmata (es. ogni giorno alle 08:00 UTC)
  schedule:
    - cron: '0 8 * * *'
  
  # Permette anche di avviarlo manualmente con un click da GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Esecuzione del Trading Bot / Backtest
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python main.py
