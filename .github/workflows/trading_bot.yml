name: XAUUSD Live Trading Bot

on:
  schedule:
    # Esecuzione programmata ogni ora durante la sessione di trading (Lun-Ven, dalle 08:00 alle 20:00)
    - cron: '0 8-20 * * 1-5'
  workflow_dispatch: # Consente anche l'avvio manuale da GitHub

jobs:
  run-live-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests

    - name: Run Modular Production Bot
      env:
        TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python production_runner.py
