name: XAUUSD Modular Trading Bot

on:
  schedule:
    # Esegue ogni 5 minuti, ma solo dalle 06:00 alle 20:59 UTC
    # (Coincide perfettamente con la finestra operativa 06:00 - 20:30 UTC definita in config.py)
    - cron: '*/5 6-20 * * *'
  
  # Permette di avviare il bot manualmente in qualsiasi momento dalla scheda "Actions" su GitHub
  workflow_dispatch:

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Esecuzione Trading Bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python main.py
