name: XAUUSD Daily Monitoring & Execution

on:
  schedule:
    # Esegue ogni giorno alle 21:00 UTC (subito dopo la chiusura della sessione delle 20:30)
    - cron: '0 21 * * *'
  
  # Consente comunque di avviarlo manualmente in qualsiasi momento
  workflow_dispatch:

jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Esecuzione Backtest Dettagliato / Bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python backtest_detailed.py
