name: XAUUSD Live Trading Bot

on:
  schedule:
    # Esegue ogni 5 minuti durante la finestra operativa (06:00 - 20:59 UTC)
    - cron: '*/5 6-20 * * *'
  
  workflow_dispatch:

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permette al bot di committare il file bot_state.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Esecuzione Segnali Operativi
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python main.py

      - name: Salva stato bot (Pausa / Reset)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json || true
          git commit -m "Update bot state [skip ci]" || true
          git push || true
