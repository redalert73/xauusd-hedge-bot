name: Test - Adaptive Omnibus

on:
  schedule:
    - cron: '45 2 * * *'  # Esecuzione giornaliera differita
  workflow_dispatch:      # Permette il lancio manuale da GitHub Web

jobs:
  run-omnibus-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Omnibus Adaptive Backtest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python backtest_master.py --strategy omnibus
