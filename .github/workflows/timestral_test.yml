name: Test Timestral (previsione modello AI)

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pagine da 5000 candele M5"
        default: "20"
      model:
        description: "Modello (Timestral-5M veloce; 28M/123M/209M piu' lenti)"
        default: "mistralai/Timestral-5M"

# Un solo workflow alla volta che usa Twelve Data: il piano gratuito ha 8 richieste al minuto.
concurrency:
  group: twelvedata
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze (torch versione CPU)
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install timecopilot-timestral
      - name: Test Timestral
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python -u timestral_test.py --pages ${{ inputs.pages }} --model ${{ inputs.model }} | tee timestral_report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: timestral-report
          path: timestral_report.txt
