name: Contrarian VWAP & Breakout Elite Backtest

on:
  workflow_dispatch: # Permette l'avvio manuale con un clic dalla tab Actions di GitHub
  schedule:
    - cron: '0 6 * * *' # (Opzionale) Esegue il backtest automaticamente ogni giorno alle 06:00 UTC

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Backtest Master Script
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python backtest_master.py
